<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · TradeGuru</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="{% static 'css/tokens.css' %}" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg,var(--tt-ink),#312e81 55%,var(--tt-blue));
      min-height:100vh; font-family:var(--tt-font-body);
    }
    .card-login { max-width: 400px; border:0; border-radius:var(--tt-radius);
                  box-shadow:0 10px 30px rgba(15,16,40,.35); }
    .card-login h1 { font-family:var(--tt-font-display); font-weight:800; }
    .brand-mark { width:44px; height:44px; border-radius:.6rem; display:inline-flex;
                  align-items:center; justify-content:center; font-size:1.4rem; font-weight:700;
                  background:linear-gradient(135deg,var(--tt-indigo),var(--tt-blue)); color:#fff; }
  </style>
</head>
<body class="d-flex align-items-center">
  <div id="root" class="container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <script type="text/babel">
  {% verbatim %}
    const { useState } = React;

    function LoginApp() {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        setBusy(true); setError('');
        try {
          const res = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();
          if (res.ok) { window.location.href = '/'; return; }
          setError(data.detail || 'Login failed');
        } catch (err) {
          setError('Network error: ' + err.message);
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="row justify-content-center">
          <div className="col">
            <div className="card card-login mx-auto shadow">
              <div className="card-body p-4">
                <div className="text-center mb-3">
                  <span className="brand-mark">₹</span>
                  <h1 className="h4 mt-2 mb-0">TradeGuru</h1>
                </div>
                {error && <div className="alert alert-danger py-2 small">{error}</div>}
                <form onSubmit={submit}>
                  <div className="mb-3">
                    <label className="form-label">Username or email</label>
                    <input className="form-control" value={username} autoFocus
                           onChange={e => setUsername(e.target.value)} required />
                  </div>
                  <div className="mb-3">
                    <label className="form-label">Password</label>
                    <input type="password" className="form-control" value={password}
                           onChange={e => setPassword(e.target.value)} required />
                  </div>
                  <button className="btn btn-primary w-100" disabled={busy}>
                    {busy ? 'Signing in…' : 'Sign in'}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LoginApp />);
  {% endverbatim %}
  </script>
</body>
</html>
